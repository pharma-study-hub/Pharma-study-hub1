<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43"><title>Pharma Study Hub</title>
<style>
:root{--navy:#102a43;--navy2:#183b56;--teal:#0f9f91;--teal2:#d9f5ef;--bg:#f4f7fa;--card:#fff;--text:#243746;--muted:#6b7c8b;--line:#e3eaf0;--red:#d9534f;--amber:#c78116;--shadow:0 8px 24px #102a430c}
[data-theme="dark"]{--bg:#0d1924;--card:#142534;--text:#e8f0f5;--muted:#a0b2c0;--line:#2b4050;--teal2:#183d3b;--shadow:0 8px 24px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:22px;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{width:42px;height:42px;border-radius:13px;background:var(--teal);display:grid;place-items:center;font-size:24px}.brand b{display:block;font-size:17px}.brand small{color:#bdd0dc}.navlabel{color:#8fa9ba;text-transform:uppercase;letter-spacing:1.3px;font-size:10px;padding:0 12px;margin-bottom:5px}.nav{display:grid;gap:5px}.nav button{color:#d4e1e9;background:transparent;text-align:left;padding:11px 13px;border-radius:10px;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--teal)}.nav .ico{width:20px;text-align:center}.sidefoot{margin-top:auto;padding:14px 8px;color:#9fb6c5;font-size:12px}.main{flex:1;min-width:0}.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line);background:var(--card)}.topbar .identity{font-weight:700;color:var(--navy);font-size:14px}.dark .topbar .identity{color:var(--text)}.topright{display:flex;gap:10px;align-items:center}.wrap{max-width:1440px;padding:28px 34px 40px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:25px}.eyebrow{font-size:12px;color:var(--teal);font-weight:800;letter-spacing:1px;text-transform:uppercase}.welcome h1{font-size:clamp(24px,3vw,34px);margin:5px 0 4px;color:var(--navy);line-height:1.3}.dark .welcome h1{color:var(--text)}.welcome p{margin:0;color:var(--muted)}.btn{border-radius:10px;padding:10px 15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}.btn.primary{background:var(--teal);color:#fff}.btn.primary:hover{filter:brightness(.94);transform:translateY(-1px)}.btn.secondary{background:var(--teal2);color:var(--teal)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:var(--shadow);min-width:0}.stat{display:flex;gap:13px;align-items:center}.staticon{width:43px;height:43px;border-radius:13px;background:var(--teal2);display:grid;place-items:center;font-size:20px}.statlabel{font-size:12px;color:var(--muted)}.statnum{font-size:27px;font-weight:800;line-height:1.2;margin-top:3px}.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:18px;margin-bottom:20px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.cardhead h2,.sectiontitle{font-size:17px;margin:0;color:var(--text)}.muted{color:var(--muted)}.progressline{height:8px;background:var(--line);border-radius:20px;overflow:hidden}.progressline span{height:100%;display:block;background:var(--teal);border-radius:20px;transition:width .25s}.overall{display:flex;align-items:center;gap:18px}.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(var(--teal) var(--p,0%),var(--line) 0);position:relative}.ring:before{content:"";position:absolute;inset:8px;background:var(--card);border-radius:50%}.ring strong{position:relative;font-size:19px}.taskrow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.taskrow:last-child{border-bottom:0}.taskrow input[type=checkbox]{margin-top:5px;accent-color:var(--teal);width:16px;height:16px}.taskbody{flex:1;min-width:0}.tasktitle{font-weight:700;overflow-wrap:anywhere}.tasktitle.done{text-decoration:line-through;color:var(--muted)}.taskmeta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.pill{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--teal2);color:var(--teal);white-space:nowrap}.pill.high{background:#fff0ef;color:var(--red)}.pill.medium{background:#fff4df;color:var(--amber)}.pill.overdue{background:#fff0ef;color:var(--red)}.subjectgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.subject{cursor:pointer;transition:.18s}.subject:hover{transform:translateY(-3px);border-color:#9bd9d1}.subjecttop{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.subjecticon{font-size:24px;width:46px;height:46px;border-radius:14px;background:var(--teal2);display:grid;place-items:center}.subject h3{font-size:14px;margin:0 0 5px}.subject p{font-size:12px;color:var(--muted);margin:0 0 13px}.subjectfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}.field,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;outline:none}.field:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #0f9f9117}.toolbar .field{flex:1;min-width:170px}.toolbar select{width:auto;min-width:135px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgroup{display:grid;gap:6px}.formgroup label{font-size:12px;font-weight:700;color:var(--muted)}.formgroup.full{grid-column:1/-1}.formgroup textarea{min-height:100px;resize:vertical}.modalback{position:fixed;inset:0;background:#07152199;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.show{display:flex}.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:24px;box-shadow:0 24px 80px #0003}.modal h2{margin:0 0 18px;font-size:21px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:8px}.notegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.note h3{margin:0 0 8px;font-size:16px}.notecontent{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:13px;max-height:130px;overflow:hidden}.notetag{display:inline-block;margin:8px 5px 0 0;font-size:11px;background:var(--bg);border-radius:6px;padding:3px 7px}.pagehead{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px}.pagehead h1{margin:3px 0;font-size:27px}.subtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.subtabs button{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:8px 13px}.subtabs button.active{background:var(--teal2);color:var(--teal);border-color:transparent;font-weight:700}.timerbox{text-align:center;padding:36px 20px}.timerface{font-size:clamp(48px,9vw,76px);font-weight:800;letter-spacing:2px;color:var(--navy);margin:16px 0}.dark .timerface{color:var(--text)}.timercontrols{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.quote{border-left:3px solid var(--teal);padding:12px 15px;background:var(--teal2);border-radius:0 10px 10px 0;color:var(--text);font-style:italic}.notice{padding:12px 14px;background:var(--teal2);border-radius:10px;color:var(--teal);font-size:13px;margin-bottom:16px}.settingsgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mobiletoggle{display:none}.footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}.footer strong{color:var(--teal)}.inline-actions{display:flex;gap:6px}.hidden{display:none!important}
@media(max-width:1100px){.subjectgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.notegrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.sidebar{position:fixed;z-index:15;inset:0 auto 0 0;width:270px;transform:translateX(-105%);transition:transform .22s;box-shadow:20px 0 60px #0002}.sidebar.open{transform:translateX(0)}.mobiletoggle{display:inline-flex}.topbar{height:64px;padding:0 16px}.topbar .identity{font-size:11px;max-width:210px}.wrap{padding:22px 15px 30px}.welcome{display:block}.welcome .btn{margin-top:15px}.grid2{grid-template-columns:1fr}.stats{gap:10px}.card{padding:15px}.statnum{font-size:23px}.subjectgrid{gap:10px}.subject{padding:14px}.notegrid{grid-template-columns:1fr}.settingsgrid{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.formgroup.full{grid-column:auto}.toolbar select{flex:1;min-width:130px}.ring{width:78px;height:78px}.modal{padding:18px}}

/* Arabic / RTL interface */
html[dir="rtl"] body{font-family:Tahoma,"Segoe UI",Arial,sans-serif}
html[dir="rtl"] .sidebar{ text-align:right }
html[dir="rtl"] .nav button{ text-align:right }
html[dir="rtl"] .nav button.active{box-shadow:inset -3px 0 var(--teal)}
html[dir="rtl"] .quote{border-left:0;border-right:3px solid var(--teal);border-radius:10px 0 0 10px}
html[dir="rtl"] .sidebar{right:0;left:auto}
html[dir="rtl"] .sidebar .nav button{flex-direction:row}
@media(max-width:760px){html[dir="rtl"] .sidebar{transform:translateX(105%)}html[dir="rtl"] .sidebar.open{transform:translateX(0)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">⚕</div><div><b>Pharma Study Hub</b><small>Your personal study space</small></div></div>
 <div><div class="navlabel">Workspace</div><nav class="nav" id="mainnav">
 <button data-page="dashboard" class="active"><span class="ico">⌂</span> Dashboard</button>
 <button data-page="tasks"><span class="ico">☑</span> To-Do List</button>
 <button data-page="subjects"><span class="ico">▦</span> All Subjects</button>
 <button data-page="notes"><span class="ico">▤</span> Study Notes</button>
 <button data-page="timer"><span class="ico">◷</span> Study Timer</button>
 <button data-page="settings"><span class="ico">⚙</span> Settings</button>
 </nav></div>
 <div><div class="navlabel">Subjects</div><nav class="nav" id="subjectnav"></nav></div>
 <div class="sidefoot">Designed for focused learning.<br>© Pharma Study Hub</div>
</aside>
<main class="main">
<header class="topbar"><div class="topright"><button class="btn ghost mobiletoggle" id="menubtn" aria-label="Open navigation">☰</button><span class="identity">طالب في كلية الصيدلة جامعة بني سويف</span></div><div class="topright"><button class="btn ghost small" id="themebtn">☾ Theme</button><span class="pill">Pharmacy Student</span></div></header>
<div class="wrap" id="view"></div>
<footer class="footer">Made for your next breakthrough · <strong>Designed By Dr BTUA07</strong></footer>
</main></div>
<div class="modalback" id="modalback"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
<input id="importfile" type="file" accept="application/json,.json" class="hidden">
<script>
const SUBJECTS=[
 {id:'organic',name:'Organic Chemistry',icon:'⚗️',color:'#0f9f91'},
 {id:'analytical',name:'Analytical Chemistry',icon:'🧪',color:'#4776c7'},
 {id:'plants',name:'Medicinal Plants',icon:'🌿',color:'#51965b'},
 {id:'orientation',name:'Pharmacy Orientation',icon:'🎓',color:'#b982d6'},
 {id:'terminology',name:'Medical Terminology',icon:'🩺',color:'#d17d63'},
 {id:'it',name:'IT',icon:'💻',color:'#6084a0'},
 {id:'english',name:'English',icon:'📘',color:'#d5a43b'},
 {id:'math',name:'Math',icon:'📐',color:'#7d79cb'}
];
const QUOTES=['Small progress every day adds up to big results.','Study with purpose; become the pharmacist people trust.','Consistency beats cramming. One focused session at a time.','Your future patients are worth today’s effort.','Start where you are. Use what you have. Do what you can.'];
const KEY='pharmaStudyHub_v1';
const blank=()=>({tasks:[],notes:[],materials:[],folders:[],revision:[],bookmarks:[],sessions:[],prefs:{theme:'light',dailyGoal:120,weeklyGoal:900,examDates:{}}});
let db=load(),page='dashboard',activeSubject='organic',taskFilter='all',noteSearch='',timerSeconds=1500,timerInitial=1500,timerInterval=null,timerRunning=false,sessionStart=null;
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.tasks)?{...blank(),...d,prefs:{...blank().prefs,...(d.prefs||{})}}:blank()}catch{return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){alert('Could not save locally. Your browser storage may be full. Export a backup and remove large attachments.');}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function subject(id){return SUBJECTS.find(s=>s.id===id)||SUBJECTS[0]}
function today(){return new Date().toISOString().slice(0,10)}
function dateLabel(d){if(!d)return 'No deadline';let x=new Date(d+'T12:00:00');return x.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function dueState(t){return t.status!=='Completed'&&t.due&&t.due<today()?'overdue':''}
function stats(list=db.tasks){return {total:list.length,done:list.filter(t=>t.status==='Completed').length,pending:list.filter(t=>t.status!=='Completed').length,overdue:list.filter(t=>dueState(t)).length}}
function pct(list=db.tasks){let s=stats(list);return s.total?Math.round(s.done/s.total*100):0}
function nav(){document.querySelectorAll('#mainnav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('subjectnav').innerHTML=SUBJECTS.map(s=>`<button data-subject="${s.id}" class="${page==='subject'&&activeSubject===s.id?'active':''}"><span class="ico">${s.icon}</span>${s.name}</button>`).join('')}
function go(p,sid){page=p;if(sid)activeSubject=sid;document.getElementById('sidebar').classList.remove('open');render()}
document.getElementById('mainnav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.getElementById('subjectnav').addEventListener('click',e=>{let b=e.target.closest('[data-subject]');if(b)go('subject',b.dataset.subject)});
document.getElementById('menubtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('themebtn').onclick=()=>{db.prefs.theme=db.prefs.theme==='dark'?'light':'dark';save();applyTheme();render()};
function applyTheme(){document.documentElement.dataset.theme=db.prefs.theme||'light';document.getElementById('themebtn').textContent=db.prefs.theme==='dark'?'☀ Light mode':'☾ Dark mode'}
function render(){nav();applyTheme();let v=document.getElementById('view');({dashboard:renderDashboard,tasks:renderTasks,subjects:renderSubjects,subject:renderSubject,notes:renderNotes,timer:renderTimer,settings:renderSettings}[page]||renderDashboard)(); }
function statCard(icon,label,value){return `<div class="card stat"><div class="staticon">${icon}</div><div><div class="statlabel">${label}</div><div class="statnum">${value}</div></div></div>`}
function taskHTML(t,actions=true){return `<div class="taskrow"><input type="checkbox" aria-label="Mark ${esc(t.title)} completed" data-toggle-task="${t.id}" ${t.status==='Completed'?'checked':''}><div class="taskbody"><div class="tasktitle ${t.status==='Completed'?'done':''}">${esc(t.title)}</div><div class="taskmeta"><span>${esc(subject(t.subject).name)}</span><span>·</span><span>${t.due?'Due '+dateLabel(t.due):'No deadline'}</span><span class="pill ${t.priority.toLowerCase()}">${esc(t.priority)}</span>${dueState(t)?'<span class="pill overdue">Overdue</span>':''}<span>${esc(t.status)}</span></div>${t.description?`<div class="muted" style="font-size:12px;margin-top:5px">${esc(t.description)}</div>`:''}</div>${actions?`<div class="inline-actions"><button class="btn ghost small" data-edit-task="${t.id}" title="Edit">✎</button><button class="btn ghost small" data-delete-task="${t.id}" title="Delete">×</button></div>`:''}</div>`}
function taskList(list,empty='No tasks here yet. Add your first study task to get started.'){return list.length?list.map(t=>taskHTML(t)).join(''):`<div class="empty"><div class="big">☑</div>${empty}<div style="margin-top:12px"><button class="btn secondary" data-action="add-task">＋ Add a task</button></div></div>`}
function subjectCard(s){let ts=db.tasks.filter(t=>t.subject===s.id);return `<div class="card subject" data-open-subject="${s.id}"><div class="subjecttop"><div class="subjecticon">${s.icon}</div><span class="pill">${pct(ts)}%</span></div><h3>${s.name}</h3><p>${stats(ts).done} of ${ts.length} tasks completed</p><div class="progressline"><span style="width:${pct(ts)}%"></span></div><div class="subjectfoot" style="margin-top:9px"><span>${stats(ts).pending} pending</span><span>Open →</span></div></div>`}
function renderDashboard(){let s=stats(),todayTasks=db.tasks.filter(t=>t.due===today()&&t.status!=='Completed'),upcoming=db.tasks.filter(t=>t.due>=today()&&t.due<=new Date(Date.now()+7*86400000).toISOString().slice(0,10)&&t.status!=='Completed').sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5),recent=db.notes.slice().sort((a,b)=>b.updated-a.updated).slice(0,3);
let q=QUOTES[(new Date().getDate()+new Date().getMonth())%QUOTES.length];
document.getElementById('view').innerHTML=`<section class="welcome"><div><div class="eyebrow">YOUR PERSONAL PHARMACY STUDY SPACE</div><h1>طالب في كلية الصيدلة جامعة بني سويف</h1><p>Welcome back. A little progress today goes a long way.</p></div><button class="btn primary" data-action="add-task">＋ Add New Task</button></section>
<div class="stats">${statCard('☑','Total Tasks',s.total)}${statCard('✓','Completed',s.done)}${statCard('◷','Pending',s.pending)}${statCard('⚠','Overdue',s.overdue)}</div>
<div class="grid2"><section class="card"><div class="cardhead"><h2>Your overall progress</h2><span class="pill">${pct()}% complete</span></div><div class="overall"><div class="ring" style="--p:${pct()*3.6}deg"><strong>${pct()}%</strong></div><div style="flex:1"><h3 style="margin:0 0 5px">Keep building momentum</h3><p class="muted" style="margin:0 0 13px;font-size:13px">${s.done} completed out of ${s.total} study tasks.</p><div class="progressline"><span style="width:${pct()}%"></span></div><p class="muted" style="font-size:12px;margin:8px 0 0">Daily goal: ${db.prefs.dailyGoal||120} minutes</p></div></div></section>
<section class="card"><div class="cardhead"><h2>Study inspiration</h2><span>✦</span></div><div class="quote">“${q}”</div><p class="muted" style="font-size:12px;margin-bottom:0">Refresh the page for a new thought.</p></section></div>
<div class="grid2"><section class="card"><div class="cardhead"><h2>Today's tasks</h2><button class="btn ghost small" data-action="view-today">View all</button></div>${taskList(todayTasks,'No tasks due today. Enjoy the breathing room or plan ahead.')}</section>
<section class="card"><div class="cardhead"><h2>Upcoming deadlines</h2><button class="btn ghost small" data-action="view-upcoming">View all</button></div>${upcoming.length?upcoming.map(t=>`<div class="taskrow"><div class="staticon" style="width:36px;height:36px;font-size:15px">◷</div><div class="taskbody"><div class="tasktitle">${esc(t.title)}</div><div class="taskmeta">${dateLabel(t.due)} · ${esc(subject(t.subject).name)}</div></div><span class="pill ${t.priority.toLowerCase()}">${t.priority}</span></div>`).join(''):'<div class="empty">No upcoming deadlines in the next 7 days.</div>'}</section></div>
<div class="card" style="margin-bottom:20px"><div class="cardhead"><h2>Your subjects</h2><button class="btn ghost small" data-page="subjects">All subjects →</button></div><div class="subjectgrid">${SUBJECTS.map(subjectCard).join('')}</div></div>
<div class="card"><div class="cardhead"><h2>Recently updated notes</h2><button class="btn ghost small" data-page="notes">All notes →</button></div>${recent.length?recent.map(n=>`<div class="taskrow"><div class="staticon">▤</div><div class="taskbody"><div class="tasktitle">${esc(n.title)}</div><div class="taskmeta">${esc(subject(n.subject).name)} · Updated ${new Date(n.updated).toLocaleDateString()}</div></div><button class="btn ghost small" data-edit-note="${n.id}">Open</button></div>`).join(''):'<div class="empty">Your notes will show up here when you create them.</div>'}</div>`}
function renderSubjects(){document.getElementById('view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">YOUR CURRICULUM</div><h1>All Subjects</h1><p class="muted">Eight spaces for your lectures, notes, and revision.</p></div></div><div class="subjectgrid">${SUBJECTS.map(subjectCard).join('')}</div>`}
function renderTasks(){let list=db.tasks.slice();if(taskFilter==='today')list=list.filter(t=>t.due===today()&&t.status!=='Completed');if(taskFilter==='upcoming')list=list.filter(t=>t.due>=today()&&t.status!=='Completed');if(taskFilter==='completed')list=list.filter(t=>t.status==='Completed');if(taskFilter==='overdue')list=list.filter(t=>dueState(t));let q=document.getElementById('tasksearch')?.value?.toLowerCase()||'';list=list.filter(t=>t.title.toLowerCase().includes(q));let subj=document.getElementById('tasksubject')?.value||'';if(subj)list=list.filter(t=>t.subject===subj);let status=document.getElementById('taskstatus')?.value||'';if(status)list=list.filter(t=>t.status===status);let priority=document.getElementById('taskpriority')?.value||'';if(priority)list=list.filter(t=>t.priority===priority);let sort=document.getElementById('tasksort')?.value||'due';list.sort((a,b)=>sort==='created'?b.created-a.created:sort==='priority'?({High:0,Medium:1,Low:2}[a.priority]-({High:0,Medium:1,Low:2}[b.priority])):((a.due||'9999').localeCompare(b.due||'9999')));
document.getElementById('view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">PLAN. FOCUS. COMPLETE.</div><h1>To-Do List</h1><p class="muted">${db.tasks.length} tasks in your study plan</p></div><button class="btn primary" data-action="add-task">＋ Add Task</button></div><div class="subtabs">${[['all','All Tasks'],['today',"Today's Tasks"],['upcoming','Upcoming'],['completed','Completed'],['overdue','Overdue']].map(([v,l])=>`<button data-filter="${v}" class="${taskFilter===v?'active':''}">${l}</button>`).join('')}</div><div class="toolbar"><input id="tasksearch" class="field" placeholder="Search tasks by title…" value="${esc(document.getElementById('tasksearch')?.value||'')}"><select id="tasksubject"><option value="">All subjects</option>${SUBJECTS.map(s=>`<option value="${s.id}" ${document.getElementById('tasksubject')?.value===s.id?'selected':''}>${s.name}</option>`).join('')}</select><select id="taskstatus"><option value="">All statuses</option>${['Not Started','In Progress','Completed'].map(s=>`<option ${document.getElementById('taskstatus')?.value===s?'selected':''}>${s}</option>`).join('')}</select><select id="taskpriority"><option value="">All priorities</option>${['High','Medium','Low'].map(s=>`<option ${document.getElementById('taskpriority')?.value===s?'selected':''}>${s}</option>`).join('')}</select><select id="tasksort"><option value="due">Sort: due date</option><option value="priority">Sort: priority</option><option value="created">Sort: newest</option></select></div><div class="card">${taskList(list,'No tasks match these filters. Try changing your search or add a task.')}</div>`;
['tasksearch','tasksubject','taskstatus','taskpriority','tasksort'].forEach(id=>document.getElementById(id).addEventListener(id==='tasksearch'?'input':'change',()=>{let vals={};['tasksearch','tasksubject','taskstatus','taskpriority','tasksort'].forEach(k=>vals[k]=document.getElementById(k).value);renderTasks();Object.entries(vals).forEach(([k,v])=>{let el=document.getElementById(k);if(el)el.value=v})}))}
function renderSubject(){let s=subject(activeSubject),ts=db.tasks.filter(t=>t.subject===s.id),ns=db.notes.filter(n=>n.subject===s.id),ms=db.materials.filter(n=>n.subject===s.id),rev=db.revision.filter(n=>n.subject===s.id);document.getElementById('view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">SUBJECT WORKSPACE</div><h1>${s.icon} ${s.name}</h1><p class="muted">One place for tasks, lecture notes, and exam revision.</p></div><button class="btn primary" data-action="add-task" data-subject-id="${s.id}">＋ Add Subject Task</button></div><div class="stats">${statCard('☑','Total Tasks',ts.length)}${statCard('✓','Completed',stats(ts).done)}${statCard('◷','Pending',stats(ts).pending)}${statCard('↗','Progress',pct(ts)+'%')}</div><div class="subtabs"><button class="active" data-subtab="overview">Overview</button><button data-subtab="notes">Study Notes (${ns.length})</button><button data-subtab="materials">Learning Materials (${ms.length})</button><button data-subtab="revision">Revision & Exams</button><button data-subtab="folders">Lectures & Topics</button></div><div id="subjectcontent"><div class="grid2"><section class="card"><div class="cardhead"><h2>Subject progress</h2><span class="pill">${pct(ts)}%</span></div><div class="progressline"><span style="width:${pct(ts)}%"></span></div><p class="muted">${stats(ts).done} of ${ts.length} tasks completed.</p><button class="btn secondary" data-action="add-note" data-subject-id="${s.id}">＋ New Study Note</button></section><section class="card"><div class="cardhead"><h2>Quick revision checklist</h2><button class="btn ghost small" data-subtab="revision">Manage</button></div>${rev.slice(0,4).map(r=>`<div class="taskrow"><input type="checkbox" data-toggle-revision="${r.id}" ${r.done?'checked':''}><div class="taskbody">${esc(r.text)}</div><button class="btn ghost small" data-delete-revision="${r.id}">×</button></div>`).join('')||'<div class="empty">Add topics you want to revise before exams.</div>'}<button class="btn ghost small" data-action="add-revision" data-subject-id="${s.id}">＋ Add revision topic</button></section></div><section class="card"><div class="cardhead"><h2>Subject tasks</h2><button class="btn ghost small" data-page="tasks">Open task manager →</button></div>${taskList(ts)}</section><section class="card" style="margin-top:18px"><div class="cardhead"><h2>Recent notes</h2><button class="btn ghost small" data-subtab="notes">View all →</button></div>${ns.slice().sort((a,b)=>b.updated-a.updated).slice(0,3).map(noteCard).join('')||'<div class="empty">No notes yet. Capture the key ideas from your next lecture.</div>'}</section></div>`;
document.querySelectorAll('[data-subtab]').forEach(b=>b.onclick=()=>renderSubjectTab(b.dataset.subtab,s.id));
}
function renderSubjectTab(tab,sid){let s=subject(sid),root=document.getElementById('subjectcontent');document.querySelectorAll('[data-subtab]').forEach(b=>b.classList.toggle('active',b.dataset.subtab===tab));if(tab==='overview'){renderSubject();return}
if(tab==='notes'){let ns=db.notes.filter(n=>n.subject===sid);root.innerHTML=`<div class="cardhead"><h2>Study Notes & Summaries</h2><button class="btn primary" data-action="add-note" data-subject-id="${sid}">＋ New Note</button></div><div class="toolbar"><input class="field" id="subnotesearch" placeholder="Search this subject's notes…"></div><div class="notegrid" id="subnotelist">${ns.map(noteCard).join('')||'<div class="empty">No notes yet. Create your first note.</div>'}</div>`;document.getElementById('subnotesearch').oninput=e=>{let q=e.target.value.toLowerCase();document.getElementById('subnotelist').innerHTML=ns.filter(n=>(n.title+' '+n.content+' '+(n.tags||'')).toLowerCase().includes(q)).map(noteCard).join('')||'<div class="empty">No matching notes.</div>'}}
if(tab==='materials'){let ms=db.materials.filter(n=>n.subject===sid);root.innerHTML=`<div class="cardhead"><h2>Explanations & Learning Materials</h2><button class="btn primary" data-action="add-material" data-subject-id="${sid}">＋ Add Material</button></div>${ms.map(m=>`<div class="card" style="margin-bottom:12px"><div class="cardhead"><h3>${esc(m.title)}</h3><div><button class="btn ghost small" data-edit-material="${m.id}">Edit</button> <button class="btn ghost small" data-delete-material="${m.id}">Delete</button></div></div><div style="white-space:pre-wrap">${esc(m.content)}</div>${m.url?`<p><a href="${esc(m.url)}" target="_blank" rel="noopener">Open learning resource ↗</a></p>`:''}<div class="taskmeta">Updated ${new Date(m.updated).toLocaleDateString()}</div></div>`).join('')||'<div class="empty">Add lecture explanations, key definitions, examples, solved problems, or links.</div>'}`}
if(tab==='revision'){let rev=db.revision.filter(r=>r.subject===sid),exam=db.prefs.examDates[sid]||'';root.innerHTML=`<div class="grid2"><section class="card"><div class="cardhead"><h2>Exam preparation</h2><span class="pill">${rev.length?Math.round(rev.filter(r=>r.done).length/rev.length*100):0}%</span></div><div class="progressline"><span style="width:${rev.length?rev.filter(r=>r.done).length/rev.length*100:0}%"></span></div><p class="muted">${rev.filter(r=>r.done).length} of ${rev.length} topics revised</p><div class="formgroup"><label>Exam date</label><input class="field" type="date" id="examdate" value="${exam}"></div><p class="muted" id="examcount">${exam?countdown(exam):'Set a date to see your countdown.'}</p></section><section class="card"><div class="cardhead"><h2>Difficult topics / important questions</h2><button class="btn secondary" data-action="add-revision" data-subject-id="${sid}">＋ Add topic</button></div><p class="muted">Use checklist items to track difficult concepts, exam questions, or revision targets.</p></section></div><div class="card">${rev.map(r=>`<div class="taskrow"><input type="checkbox" data-toggle-revision="${r.id}" ${r.done?'checked':''}><div class="taskbody"><div class="${r.done?'tasktitle done':'tasktitle'}">${esc(r.text)}</div><div class="taskmeta">${r.difficult?'Difficult topic · ':''}${r.question?'Important question':''}</div></div><button class="btn ghost small" data-delete-revision="${r.id}">Delete</button></div>`).join('')||'<div class="empty">Your revision checklist is empty.</div>'}</div>`;document.getElementById('examdate').onchange=e=>{db.prefs.examDates[sid]=e.target.value;save();document.getElementById('examcount').textContent=e.target.value?countdown(e.target.value):'Set a date to see your countdown.'}}
if(tab==='folders'){let fs=db.folders.filter(f=>f.subject===sid);root.innerHTML=`<div class="cardhead"><h2>Lectures, Chapters & Topics</h2><button class="btn primary" data-action="add-folder" data-subject-id="${sid}">＋ New Category</button></div><p class="muted">Organize your material into a hierarchy such as Lectures → Reactions → Revision Notes.</p><div class="notegrid">${fs.map(f=>`<div class="card"><div class="cardhead"><h3>📁 ${esc(f.name)}</h3><div><button class="btn ghost small" data-edit-folder="${f.id}">Edit</button><button class="btn ghost small" data-delete-folder="${f.id}">×</button></div></div><p class="muted">${esc(f.parent||'Top-level category')}</p></div>`).join('')||'<div class="empty">No categories yet. Add your first chapter or lecture folder.</div>'}</div>`}
}
function countdown(d){let n=Math.ceil((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);return n<0?`Exam date passed ${Math.abs(n)} day(s) ago.`:n===0?'Exam day is today!':`${n} day(s) until your exam.`}
function noteCard(n){return `<article class="card note"><div class="cardhead"><div>${n.pinned?'<span title="Pinned">📌 </span>':''}<span class="pill">${esc(subject(n.subject).name)}</span></div><div class="inline-actions"><button class="btn ghost small" data-edit-note="${n.id}">Edit</button><button class="btn ghost small" data-delete-note="${n.id}">×</button></div></div><h3>${esc(n.title)}</h3><div class="notecontent">${esc(n.content)}</div><div>${(n.tags||'').split(',').filter(Boolean).map(t=>`<span class="notetag">${esc(t.trim())}</span>`).join('')}</div><div class="taskmeta" style="margin-top:12px">Updated ${new Date(n.updated).toLocaleDateString()}</div></article>`}
function renderNotes(){let q=noteSearch;let ns=db.notes.slice().sort((a,b)=>(b.pinned-a.pinned)||b.updated-a.updated).filter(n=>(n.title+' '+n.content+' '+(n.tags||'')).toLowerCase().includes(q.toLowerCase()));document.getElementById('view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">YOUR KNOWLEDGE LIBRARY</div><h1>Study Notes</h1><p class="muted">Capture explanations and make revision easier.</p></div><button class="btn primary" data-action="add-note">＋ Create Note</button></div><div class="toolbar"><input class="field" id="notesearch" placeholder="Search titles, content, or tags…" value="${esc(q)}"><select id="notefilter"><option value="">All subjects</option>${SUBJECTS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="notegrid" id="noteslist">${ns.map(noteCard).join('')||'<div class="empty">No notes found. Create a note for your next lecture.</div>'}</div>`;document.getElementById('notesearch').oninput=e=>{noteSearch=e.target.value;let q=noteSearch.toLowerCase();document.getElementById('noteslist').innerHTML=db.notes.slice().sort((a,b)=>(b.pinned-a.pinned)||b.updated-a.updated).filter(n=>(n.title+' '+n.content+' '+(n.tags||'')).toLowerCase().includes(q)&&(!document.getElementById('notefilter').value||n.subject===document.getElementById('notefilter').value)).map(noteCard).join('')||'<div class="empty">No matching notes.</div>'};document.getElementById('notefilter').onchange=()=>{let q=noteSearch.toLowerCase(),sid=document.getElementById('notefilter').value;document.getElementById('noteslist').innerHTML=db.notes.slice().sort((a,b)=>(b.pinned-a.pinned)||b.updated-a.updated).filter(n=>(n.title+' '+n.content+' '+(n.tags||'')).toLowerCase().includes(q)&&(!sid||n.subject===sid)).map(noteCard).join('')||'<div class="empty">No matching notes.</div>'}}
function renderTimer(){let mins=Math.floor(timerSeconds/60),secs=timerSeconds%60;document.getElementById('view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">DEEP WORK</div><h1>Study Timer</h1><p class="muted">Focus on one thing. Take breaks. Repeat.</p></div></div><div class="grid2"><section class="card timerbox"><span class="pill" id="timerlabel">Focus session</span><div class="timerface" id="timerface">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div><div class="timercontrols"><button class="btn primary" id="timerstart">${timerRunning?'Pause':'▶ Start focus'}</button><button class="btn ghost" id="timerreset">↺ Reset</button><button class="btn secondary" id="timerbreak">☕ Break (5 min)</button></div><p class="muted">A focus session counts toward your study time when completed.</p></section><section class="card"><div class="cardhead"><h2>Study goals</h2></div><div class="statlabel">Today's tracked study time</div><div class="statnum">${Math.round((db.sessions||[]).filter(s=>s.date===today()).reduce((a,s)=>a+s.minutes,0))} min</div><div class="progressline" style="margin:12px 0"><span style="width:${Math.min(100,((db.sessions||[]).filter(s=>s.date===today()).reduce((a,s)=>a+s.minutes,0)/(db.prefs.dailyGoal||120))*100)}%"></span></div><p class="muted">Daily goal: ${db.prefs.dailyGoal||120} minutes</p><div class="formgroup"><label>Focus duration (minutes)</label><input id="focusmins" class="field" type="number" min="1" max="180" value="25"></div><div class="formgroup" style="margin-top:12px"><label>Break duration (minutes)</label><input id="breakmins" class="field" type="number" min="1" max="60" value="5"></div><button class="btn secondary" style="margin-top:14px" id="applytimer">Apply durations</button></section></div><section class="card" style="margin-top:18px"><div class="cardhead"><h2>Recent study sessions</h2></div>${(db.sessions||[]).slice(-8).reverse().map(s=>`<div class="taskrow"><div class="staticon">◷</div><div class="taskbody"><div class="tasktitle">${s.minutes} minutes</div><div class="taskmeta">${dateLabel(s.date)} · ${esc(s.kind||'Focus session')}</div></div></div>`).join('')||'<div class="empty">Completed focus sessions will appear here.</div>'}</section>`;
document.getElementById('timerstart').onclick=()=>{if(timerRunning){clearInterval(timerInterval);timerRunning=false;document.getElementById('timerstart').textContent='▶ Resume'}else{timerRunning=true;document.getElementById('timerstart').textContent='Pause';timerInterval=setInterval(()=>{timerSeconds--;if(timerSeconds<=0){clearInterval(timerInterval);timerRunning=false;if(timerInitial===Number(document.getElementById('focusmins')?.value||25)*60){db.sessions.push({id:uid(),date:today(),minutes:Math.round(timerInitial/60),kind:'Focus session'});save()}alert('Session complete! Take a short break.');timerSeconds=timerInitial;renderTimer();return}updateTimerFace()},1000)}};document.getElementById('timerreset').onclick=()=>{clearInterval(timerInterval);timerRunning=false;timerSeconds=timerInitial;renderTimer()};document.getElementById('timerbreak').onclick=()=>{clearInterval(timerInterval);timerRunning=false;timerSeconds=Number(document.getElementById('breakmins').value||5)*60;timerInitial=timerSeconds;document.getElementById('timerlabel').textContent='Break time';updateTimerFace();document.getElementById('timerstart').textContent='▶ Start break'};document.getElementById('applytimer').onclick=()=>{let m=Math.max(1,Math.min(180,Number(document.getElementById('focusmins').value)||25));timerInitial=m*60;timerSeconds=timerInitial;clearInterval(timerInterval);timerRunning=false;renderTimer()}}
function updateTimerFace(){let f=document.getElementById('timerface');if(f)f.textContent=String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0')}
function renderSettings(){document.getElementById('view').innerHTML=`<div class="pagehead"><div><div class="eyebrow">YOUR PREFERENCES</div><h1>Settings & Backup</h1><p class="muted">Manage your goals, appearance, and personal study data.</p></div></div><div class="settingsgrid"><section class="card"><div class="cardhead"><h2>Study goals</h2></div><div class="formgroup"><label>Daily study goal (minutes)</label><input class="field" id="dailygoal" type="number" min="1" max="1440" value="${db.prefs.dailyGoal||120}"></div><div class="formgroup" style="margin-top:13px"><label>Weekly study goal (minutes)</label><input class="field" id="weeklygoal" type="number" min="1" max="10080" value="${db.prefs.weeklyGoal||900}"></div><button class="btn primary" id="savegoals" style="margin-top:15px">Save goals</button></section><section class="card"><div class="cardhead"><h2>Appearance</h2></div><p class="muted">Choose the theme that's comfortable for your study sessions.</p><button class="btn secondary" id="settingstheme">${db.prefs.theme==='dark'?'☀ Switch to light mode':'☾ Switch to dark mode'}</button></section><section class="card"><div class="cardhead"><h2>Backup your data</h2></div><p class="muted">Export tasks, notes, folders, revision lists, and preferences as a JSON backup. Keep a copy somewhere safe.</p><button class="btn primary" id="exportbtn">↓ Export JSON backup</button><button class="btn ghost" id="importbtn" style="margin-left:6px">↑ Import backup</button></section><section class="card"><div class="cardhead"><h2>Local storage</h2></div><div class="notice">Your data is saved in this browser on this device. It is not synced to the cloud or shared between devices.</div><p class="muted">For reliable backups, export regularly. Clearing browser data may erase locally stored information.</p><div class="taskmeta">Tasks: ${db.tasks.length} · Notes: ${db.notes.length} · Materials: ${db.materials.length}</div></section></div>`;
document.getElementById('savegoals').onclick=()=>{db.prefs.dailyGoal=Math.max(1,Math.min(1440,Number(document.getElementById('dailygoal').value)||120));db.prefs.weeklyGoal=Math.max(1,Math.min(10080,Number(document.getElementById('weeklygoal').value)||900));save();alert('Study goals saved.');renderSettings()};document.getElementById('settingstheme').onclick=()=>{db.prefs.theme=db.prefs.theme==='dark'?'light':'dark';save();render()};document.getElementById('exportbtn').onclick=exportData;document.getElementById('importbtn').onclick=()=>document.getElementById('importfile').click()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function modal(title,body,submitLabel,submit){let m=document.getElementById('modal');m.innerHTML=`<h2>${title}</h2>${body}<div class="modalactions"><button class="btn ghost" data-close-modal>Cancel</button><button class="btn primary" id="modalsubmit">${submitLabel}</button></div>`;document.getElementById('modalback').classList.add('show');m.querySelector('[data-close-modal]').onclick=closeModal;document.getElementById('modalsubmit').onclick=()=>{if(submit()!==false)closeModal()}}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
function addTask(sid='',t=null){modal(t?'Edit task':'Add a study task',`<div class="formgrid"><div class="formgroup full"><label>Task title *</label><input id="ftitle" class="field" required maxlength="180" value="${esc(t?.title||'')}" placeholder="e.g. Review lecture 3"></div><div class="formgroup full"><label>Description</label><textarea id="fdesc" placeholder="What needs to be done?">${esc(t?.description||'')}</textarea></div><div class="formgroup"><label>Subject *</label><select id="fsubject">${SUBJECTS.map(s=>`<option value="${s.id}" ${(t?.subject||sid)===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="formgroup"><label>Priority</label><select id="fpriority">${['Low','Medium','High'].map(p=>`<option ${(t?.priority||'Medium')===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="formgroup"><label>Due date</label><input id="fdue" type="date" class="field" value="${t?.due||''}"></div><div class="formgroup"><label>Due time (optional)</label><input id="ftime" type="time" class="field" value="${t?.time||''}"></div><div class="formgroup"><label>Status</label><select id="fstatus">${['Not Started','In Progress','Completed'].map(p=>`<option ${(t?.status||'Not Started')===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="formgroup"><label>Repeat</label><select id="frepeat"><option value="none">No repeat</option><option value="daily">Daily (create next task on completion)</option><option value="weekly">Weekly (create next task on completion)</option></select></div></div>`,t?'Save changes':'Create task',()=>{let title=document.getElementById('ftitle').value.trim();if(!title){alert('Please enter a task title.');return false}let data={title,description:document.getElementById('fdesc').value.trim(),subject:document.getElementById('fsubject').value,priority:document.getElementById('fpriority').value,due:document.getElementById('fdue').value,time:document.getElementById('ftime').value,status:document.getElementById('fstatus').value,repeat:document.getElementById('frepeat').value};if(t){Object.assign(t,data);t.updated=Date.now()}else db.tasks.push({id:uid(),...data,created:Date.now()});save();render();return true})}
function addNote(sid='',n=null){modal(n?'Edit study note':'Create study note',`<div class="formgrid"><div class="formgroup full"><label>Note title *</label><input id="ntitle" class="field" maxlength="180" value="${esc(n?.title||'')}" placeholder="Lecture or topic title"></div><div class="formgroup"><label>Subject *</label><select id="nsubject">${SUBJECTS.map(s=>`<option value="${s.id}" ${(n?.subject||sid)===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="formgroup"><label>Tags (comma separated)</label><input id="ntags" class="field" value="${esc(n?.tags||'')}" placeholder="exam, definitions"></div><div class="formgroup full"><label>Content (Arabic and English supported)</label><textarea id="ncontent" style="min-height:220px" placeholder="Write your summary here…">${esc(n?.content||'')}</textarea><small class="muted">Plain text editor: use headings, bullets, and numbered lists in your own text. Rich-text formatting is not included in this lightweight version.</small></div><div class="formgroup full"><label><input type="checkbox" id="npinned" ${n?.pinned?'checked':''}> Pin this note</label></div></div>`,n?'Save note':'Save note',()=>{let title=document.getElementById('ntitle').value.trim();if(!title){alert('Please enter a note title.');return false}let data={title,subject:document.getElementById('nsubject').value,tags:document.getElementById('ntags').value,content:document.getElementById('ncontent').value,pinned:document.getElementById('npinned').checked,updated:Date.now()};if(n)Object.assign(n,data);else db.notes.push({id:uid(),...data,created:Date.now()});save();render();return true})}
function addMaterial(sid,m=null){modal(m?'Edit learning material':'Add learning material',`<div class="formgrid"><div class="formgroup full"><label>Title *</label><input id="mtitle" class="field" value="${esc(m?.title||'')}"></div><div class="formgroup full"><label>Explanation / key points / solved examples</label><textarea id="mcontent" style="min-height:200px">${esc(m?.content||'')}</textarea></div><div class="formgroup full"><label>External resource URL (optional)</label><input id="murl" class="field" type="url" value="${esc(m?.url||'')}" placeholder="https://…"></div></div>`,m?'Save changes':'Add material',()=>{let title=document.getElementById('mtitle').value.trim();if(!title){alert('Please enter a title.');return false}let url=document.getElementById('murl').value.trim();if(url&&!/^https?:\/\//i.test(url)){alert('Use a valid http or https URL.');return false}let data={title,content:document.getElementById('mcontent').value,url,subject:sid,updated:Date.now()};if(m)Object.assign(m,data);else db.materials.push({id:uid(),...data,created:Date.now()});save();render();return true})}
function addRevision(sid){modal('Add revision topic',`<div class="formgroup"><label>Topic / question *</label><input id="rtext" class="field" placeholder="e.g. Practice acid-base titration problems"></div><div class="formgroup" style="margin-top:12px"><label><input type="checkbox" id="rdifficult"> Mark as difficult topic</label></div><div class="formgroup" style="margin-top:8px"><label><input type="checkbox" id="rquestion"> Mark as important exam question</label></div>`,`Add topic`,()=>{let text=document.getElementById('rtext').value.trim();if(!text){alert('Enter a topic first.');return false}db.revision.push({id:uid(),subject:sid,text,difficult:document.getElementById('rdifficult').checked,question:document.getElementById('rquestion').checked,done:false});save();render();return true})}
function addFolder(sid,f=null){modal(f?'Edit category':'Create category',`<div class="formgrid"><div class="formgroup full"><label>Category name *</label><input id="foldername" class="field" value="${esc(f?.name||'')}" placeholder="Lectures, Reactions, Chapter 1…"></div><div class="formgroup full"><label>Parent category (optional)</label><input id="folderparent" class="field" value="${esc(f?.parent||'')}" placeholder="e.g. Lectures"></div></div>`,f?'Save':'Create',()=>{let name=document.getElementById('foldername').value.trim();if(!name){alert('Enter a category name.');return false}let data={name,parent:document.getElementById('folderparent').value.trim(),subject:sid};if(f)Object.assign(f,data);else db.folders.push({id:uid(),...data});save();render();return true})}
function confirmDelete(kind,id){let obj={task:db.tasks,note:db.notes,material:db.materials,folder:db.folders,revision:db.revision}[kind].find(x=>x.id===id);if(!obj)return;if(!confirm(`Permanently delete "${obj.title||obj.name||obj.text}"? This cannot be undone.`))return;let key={task:'tasks',note:'notes',material:'materials',folder:'folders',revision:'revision'}[kind];db[key]=db[key].filter(x=>x.id!==id);save();render()}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-open-subject]');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.openSubject){go('subject',b.dataset.openSubject);return}if(b.dataset.filter){taskFilter=b.dataset.filter;renderTasks();return}if(b.dataset.action){let a=b.dataset.action,sid=b.dataset.subjectId||(page==='subject'?activeSubject:'');if(a==='add-task')addTask(sid);if(a==='add-note')addNote(sid);if(a==='add-material')addMaterial(sid);if(a==='add-revision')addRevision(sid);if(a==='add-folder')addFolder(sid);if(a==='view-today'){taskFilter='today';go('tasks')}if(a==='view-upcoming'){taskFilter='upcoming';go('tasks')}return}if(b.dataset.editTask){let t=db.tasks.find(x=>x.id===b.dataset.editTask);if(t)addTask('',t);return}if(b.dataset.deleteTask){confirmDelete('task',b.dataset.deleteTask);return}if(b.dataset.editNote){let n=db.notes.find(x=>x.id===b.dataset.editNote);if(n)addNote('',n);return}if(b.dataset.deleteNote){confirmDelete('note',b.dataset.deleteNote);return}if(b.dataset.editMaterial){let m=db.materials.find(x=>x.id===b.dataset.editMaterial);if(m)addMaterial(m.subject,m);return}if(b.dataset.deleteMaterial){confirmDelete('material',b.dataset.deleteMaterial);return}if(b.dataset.editFolder){let f=db.folders.find(x=>x.id===b.dataset.editFolder);if(f)addFolder(f.subject,f);return}if(b.dataset.deleteFolder){confirmDelete('folder',b.dataset.deleteFolder);return}if(b.dataset.deleteRevision){confirmDelete('revision',b.dataset.deleteRevision);return}});
document.addEventListener('change',e=>{if(e.target.dataset.toggleTask){let t=db.tasks.find(x=>x.id===e.target.dataset.toggleTask);if(t){let was=t.status;t.status=e.target.checked?'Completed':'Not Started';t.updated=Date.now();if(e.target.checked&&t.repeat&&t.repeat!=='none'&&t.due){let d=new Date(t.due+'T12:00:00');d.setDate(d.getDate()+(t.repeat==='daily'?1:7));db.tasks.push({...t,id:uid(),title:t.title, status:'Not Started',due:d.toISOString().slice(0,10),created:Date.now(),updated:Date.now()})}save();render()} }if(e.target.dataset.toggleRevision){let r=db.revision.find(x=>x.id===e.target.dataset.toggleRevision);if(r){r.done=e.target.checked;save();render()}}});
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pharma-study-hub-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url)}
document.getElementById('importfile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('Backup file is larger than 10 MB.');let raw=JSON.parse(await f.text()),d=raw.data||raw;if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.notes)||!d.prefs)throw Error('This does not look like a Pharma Study Hub backup.');if(!confirm('Import this backup and replace the data currently stored in this browser? Export your current data first if you want to keep it.'))return;let allowed=new Set(SUBJECTS.map(s=>s.id));for(let k of ['tasks','notes','materials','folders','revision'])if(!Array.isArray(d[k]||[]))throw Error('Invalid '+k+' data.');d.tasks=(d.tasks||[]).filter(t=>t&&typeof t.title==='string'&&allowed.has(t.subject)).map(t=>({...t,id:String(t.id||uid()),title:t.title.slice(0,180)}));d.notes=(d.notes||[]).filter(n=>n&&typeof n.title==='string'&&allowed.has(n.subject)).map(n=>({...n,id:String(n.id||uid()),title:n.title.slice(0,180)}));db={...blank(),...d,prefs:{...blank().prefs,...d.prefs}};save();alert('Backup imported successfully.');go('dashboard')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};

function translate(root){if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=walker.nextNode()){if(!n.nodeValue.trim())continue;if(n.parentElement&&n.parentElement.closest('script,style,.notecontent,.tasktitle,.taskbody,.subject h3,.subject p'))continue;const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}root.querySelectorAll('input[placeholder],textarea[placeholder],button[title],input[aria-label]').forEach(el=>{for(const a of ['placeholder','title','aria-label'])if(el.hasAttribute(a)){const v=tr(el.getAttribute(a));if(v!==el.getAttribute(a))el.setAttribute(a,v)}})}
